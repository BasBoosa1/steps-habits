<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>צעדים</title>
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161a17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="צעדים">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f6f3ee;--card:#fffdf9;--ink:#1f2420;--muted:#6f746f;--line:#e4dfd6;
  --accent:#2f6b4f;--accent-ink:#fff;--soft:#e7efe9;--warn:#b4552d;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#161a17;--card:#1f2420;--ink:#ecebe6;--muted:#9aa09a;--line:#2e342f;
    --accent:#6fb18e;--accent-ink:#0f1411;--soft:#25322b;--warn:#e08a63;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom));min-height:100vh}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:28px;margin:8px 0 4px}
h2{font-size:15px;color:var(--muted);font-weight:600;margin:24px 0 8px;display:flex;justify-content:space-between}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 14px;margin-bottom:8px;width:100%;text-align:right;color:inherit;font:inherit}
button.row{cursor:pointer}
.row .t{flex:1;min-width:0}
.row .n{font-weight:500}
.meta{font-size:13px;color:var(--muted);margin-top:2px}
.meta.late{color:var(--warn)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.check{width:34px;height:34px;flex:none;border-radius:50%;border:2px solid var(--line);background:none;
  display:grid;place-items:center;color:var(--accent-ink);font-size:18px;cursor:pointer;padding:0}
.check.on{background:var(--accent);border-color:var(--accent)}
.daynav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px}
.btn{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;
  background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.link{background:none;color:var(--accent);padding:8px}
.btn.danger{background:none;color:var(--warn)}
.btn:disabled{opacity:.4}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btns .btn{flex:1}
.empty{color:var(--muted);text-align:center;padding:32px 16px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;align-items:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;font:inherit;font-size:12px;color:var(--muted);padding:6px 10px;cursor:pointer;min-width:56px}
nav button.on{color:var(--accent);font-weight:700}
nav button b{display:block;font-size:20px;line-height:1.1}
nav .add{width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  font-size:34px;line-height:1;margin-top:-26px;box-shadow:0 4px 14px rgba(0,0,0,.18);min-width:0;padding:0}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:10}
.veil.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:20px}
label{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
input[type=text],input[type=date],textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
textarea{min-height:90px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toggle{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--ink);font-size:15px}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.two{display:flex;gap:8px}.two>div{flex:1}
.big{font-size:44px;font-weight:700;text-align:center;margin:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 16px}
.imp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.imp.need{border-color:var(--warn)}
.imp input[type=text]{padding:8px;margin-bottom:6px}
.imp .two{align-items:center}
.imp select{padding:8px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;z-index:20;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<main id="main"></main>
<nav>
  <button data-go="today"><b>✓</b>היום</button>
  <button data-go="habits"><b>☰</b>הרגלים</button>
  <button class="add" data-act="quick" aria-label="הוסף הרגל">+</button>
  <button data-go="check"><b>◔</b>בדיקה</button>
  <button data-act="menu"><b>⋯</b>עוד</button>
</nav>
<div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
