<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>צעדים</title>
<meta name="theme-color" content="#f5f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1110" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="צעדים">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f5f4f1;--card:#ffffff;--ink:#141614;--muted:#7b807b;--line:#e8e6e1;--fill:#ecebe7;
  --accent:#2E9E5B;--glass:rgba(255,255,255,.72);--scrim:rgba(20,22,20,.32);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
  --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1110;--card:#1a1d1b;--ink:#f1f1ee;--muted:#8d938d;--line:#2a2e2b;--fill:#232724;
    --glass:rgba(30,33,31,.72);--scrim:rgba(0,0,0,.5);--shadow:none;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:17px/1.4 -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 calc(110px + env(safe-area-inset-bottom));min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
main{max-width:600px;margin:0 auto;padding:12px 16px}

.top{padding:12px 4px 8px}
.top .date{font-size:13px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:.01em}
h1{font-size:34px;line-height:1.1;letter-spacing:-.02em;margin:2px 0 0;font-weight:800}
.back{background:none;border:0;color:var(--accent);font-weight:600;font-size:15px;padding:4px 0}
h2{font-size:13px;font-weight:600;color:var(--muted);margin:22px 4px 8px;letter-spacing:.02em}

/* week strip */
.week{display:flex;align-items:center;gap:2px;margin:12px 0 4px}
.week .nav{background:none;border:0;color:var(--muted);font-size:22px;padding:8px 4px;line-height:1}
.week .nav:disabled{opacity:.25}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.d{background:none;border:0;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:5px}
.d .l{font-size:12px;color:var(--muted);font-weight:600}
.d .r{--p:0;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--fill) 0);transition:transform .1s}
.d .r span{width:32px;height:32px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:15px;font-weight:600}
.d.sel .r span{background:var(--ink);color:var(--bg)}
.d.today .l{color:var(--accent)}
.d:disabled{opacity:.3}
.d:active .r{transform:scale(.92)}

.summary{display:flex;align-items:center;gap:10px;margin:14px 4px 0;font-size:14px;color:var(--muted)}
.summary .bar{flex:1;height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.summary .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .5s var(--ease)}

/* habit cards */
.card{--c:#2E9E5B;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;margin-bottom:8px;border-radius:18px;
  background:color-mix(in srgb,var(--c) 9%,var(--card));box-shadow:var(--shadow);transition:background .3s,opacity .3s,transform .12s}
.card:active{transform:scale(.985)}
.card.done{background:color-mix(in srgb,var(--c) 22%,var(--card))}
.card.met{opacity:.55}
.emo{width:44px;height:44px;flex:none;border-radius:13px;display:grid;place-items:center;font-size:23px;border:0;
  background:color-mix(in srgb,var(--c) 18%,var(--card))}
.card .t{flex:1;min-width:0;cursor:pointer}
.card .n{font-weight:600;font-size:16px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{font-size:13px;color:var(--muted);margin-top:2px}
.tick{width:40px;height:40px;flex:none;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--c) 45%,transparent);
  background:transparent;display:grid;place-items:center;padding:0;transition:background .2s,border-color .2s,transform .1s}
.tick svg{width:20px;height:20px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.tick:active{transform:scale(.88)}
.done .tick{background:var(--c);border-color:var(--c)}
.done .tick svg{opacity:1}
.pop .tick{animation:pop .2s cubic-bezier(.23,1,.32,1)}
@keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
.card{position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:var(--f,0%);background:color-mix(in srgb,var(--c) 16%,transparent);transition:width .25s cubic-bezier(.23,1,.32,1);pointer-events:none}
.card>*{position:relative}
.tick.plus{font-size:14px;font-weight:800;color:var(--c)}
.card.skip{opacity:.55}
.card.skip .tick{border-style:dashed}
.cnt{font-size:12px;font-weight:700;color:var(--c);min-width:28px;text-align:center}

/* progress */
.pcard{--c:#2E9E5B;background:var(--card);border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer}
.pcard .head{display:flex;align-items:center;gap:12px}
.pcard .head .t{flex:1;min-width:0}
.pct{font-size:20px;font-weight:800;color:var(--c);letter-spacing:-.02em}
.grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;margin-top:12px}
.grid i{aspect-ratio:1;border-radius:3px;background:color-mix(in srgb,var(--c) 13%,var(--card))}
.grid i.on{background:var(--c)}
.grid i.fu{background:transparent}
.grid i.pa{background:color-mix(in srgb,var(--c) 45%,var(--card))}
.grid i.sk{background:transparent;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 35%,transparent)}
.hint{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding:10px 12px;border-radius:12px;
  background:color-mix(in srgb,var(--c) 12%,var(--card));font-size:14px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 12px;margin-bottom:6px;width:100%;
  border:0;text-align:right;box-shadow:var(--shadow)}
.row .t{flex:1;min-width:0}
.row .n{font-weight:500}

/* buttons */
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:600;background:var(--accent);color:#fff;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.soft{background:var(--fill);color:var(--ink)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:10px}
.btn.link{background:none;color:var(--accent);padding:10px 4px}
.btn.danger{background:none;color:#d9534f}
.btn:disabled{opacity:.4}
.btns{display:flex;gap:8px;margin-top:18px}
.btns .btn{flex:1}
.full{width:100%}

.empty{text-align:center;padding:48px 16px 24px}
.empty .big{font-size:56px}
.empty p{color:var(--muted);margin:8px 0 20px}
.empty .btn{display:block;width:100%;max-width:320px;margin:8px auto 0}

/* settings */
.group{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.group>button,.group>div,.group>label{display:block;width:100%;text-align:right;background:none;border:0;padding:14px 16px;border-bottom:1px solid var(--line)}
.group>*:last-child{border-bottom:0}
.group .s{font-size:13px;color:var(--muted);margin-top:2px}
.note{font-size:13px;color:var(--muted);margin:8px 4px 0;line-height:1.5}

/* tab bar */
.tabbar{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  width:min(360px,calc(100% - 32px));display:flex;align-items:center;justify-content:space-around;padding:6px;border-radius:999px;
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 8px 30px rgba(0,0,0,.12);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);z-index:5}
.tabbar button{background:none;border:0;padding:8px 14px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;transition:background .2s,color .2s}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--ink);background:var(--fill)}
.tabbar .add{width:52px;height:52px;min-width:0;padding:0;background:var(--accent);color:#fff;justify-content:center}
.tabbar .add svg{width:26px;height:26px;stroke-width:2.6}
.tabbar .add:active{transform:scale(.92)}

/* sheet */
.veil{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .35s var(--ease);z-index:10;
  display:flex;align-items:flex-end;justify-content:center}
.veil.open{opacity:1;pointer-events:auto}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;
  padding:8px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .32s var(--ease)}
.veil.open .sheet{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 4px;font-size:22px;letter-spacing:-.01em}
.sheet .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:16px 4px 8px}
input[type=text],input[type=password],input[type=date],textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:100px;resize:vertical;line-height:1.5}
.namerow{display:flex;gap:8px}
.namerow .emoji-in{width:58px;flex:none;text-align:center;font-size:24px;padding:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--card);border-radius:999px;padding:9px 14px;font-size:15px;box-shadow:var(--shadow);transition:background .15s,transform .1s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);color:var(--bg)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid transparent;padding:0}
.sw.on{border-color:var(--ink)}

/* feature switches */
.group .sw-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0;font-size:17px;font-weight:400;color:var(--ink);cursor:pointer}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:51px;height:31px;border-radius:999px;background:var(--fill);position:relative;cursor:pointer;transition:background .2s;margin:0}
.switch::after{content:"";position:absolute;top:2px;right:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(-20px)}
.sw-row input[type=time]{width:auto}
details.more{margin-top:14px}
details.more summary{color:var(--accent);font-weight:600;font-size:15px;padding:6px 4px;cursor:pointer;list-style:none}
details.more summary::-webkit-details-marker{display:none}
input[type=number],input[type=time]{font:inherit;font-size:17px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;min-height:50px}

/* import */
.q{background:var(--card);border-radius:16px;padding:14px;margin-bottom:8px;box-shadow:var(--shadow)}
.q .qt{font-weight:600;margin-bottom:10px}
.q .of{font-size:13px;color:var(--muted);margin-bottom:6px}
.q.answered{opacity:.6}
.ii{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:8px 10px;margin-bottom:6px}
.ii.off{opacity:.4}
.ii input[type=text]{border:0;padding:4px 0;background:none;font-size:16px;font-weight:600}
.ii .t{flex:1;min-width:0}
.ii .emo{width:38px;height:38px;font-size:20px;border-radius:11px}
.chk{width:26px;height:26px;flex:none;accent-color:var(--accent)}
.spin{width:36px;height:36px;border:3px solid var(--fill);border-top-color:var(--accent);border-radius:50%;margin:40px auto 16px;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-8px);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-size:15px;font-weight:600;opacity:0;transition:opacity .25s,transform .35s var(--ease);z-index:20;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:opacity .2s!important}
  .sheet{transform:none}
}
@media (prefers-reduced-transparency: reduce){ .tabbar{background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none} }
</style>
</head>
<body>
<main id="main"></main>
<nav class="tabbar">
  <button data-go="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>היום</button>
  <button data-go="progress"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>התקדמות</button>
  <button data-go="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>עוד</button>
  <button class="add" data-act="quick" aria-label="הרגל חדש"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</nav>
<div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
